[package]
name = "autoversion"
version = "0.1.0"
edition = "2021"
authors = ["srcheesedev"]
description = "Universal semantic versioning automation for any technology stack"
license = "MIT"
repository = "https://github.com/srcheesedev/autoversion-ghaction"
keywords = ["semver", "versioning", "github-actions", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "autoversion"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
git2 = "0.18"
semver = "1.0"
anyhow = "1.0"
regex = "1.0"
quick-xml = "0.31"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true