[[bin]]
name = "autoversion"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
git2 = "0.18"
quick-xml = "0.31"
regex = "1.0"
semver = "1.0"
serde_json = "1.0"
toml = "0.8"

[dependencies.clap]
features = ["derive"]
version = "4.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"

[package]
authors = ["srcheesedev"]
categories = [
    "command-line-utilities",
    "development-tools",
]
description = "Universal semantic versioning automation for any technology stack"
edition = "2021"
keywords = [
    "semver",
    "versioning",
    "github-actions",
    "automation",
]
license = "MIT"
name = "autoversion"
repository = "https://github.com/srcheesedev/autoversion-ghaction"
version = "0.2.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

