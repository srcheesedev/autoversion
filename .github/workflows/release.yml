name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release
        id: prepare
        run: |
          mkdir -p release
          
          # Copy all archives to release folder
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          
          # Generate checksums
          cd release
          sha256sum * > checksums.txt
          
          # Extract version
          cd ..
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          {
            echo "## 🚀 What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              echo "Initial release"
            fi
            echo ""
            echo ""
            echo "## 📦 Downloads"
            echo ""
            echo "### Linux"
            echo "- x86_64 (musl): \`autoversion-linux-x86_64.tar.gz\`"
            echo ""
            echo "### macOS"
            echo "- x86_64 (Intel): \`autoversion-macos-x86_64.tar.gz\`"
            echo "- aarch64 (M1/M2): \`autoversion-macos-aarch64.tar.gz\`"
            echo ""
            echo "### Windows"
            echo "- x86_64: \`autoversion-windows-x86_64.zip\`"
            echo ""
            echo "## ✅ Verify Downloads"
            echo "\`\`\`bash"
            echo "sha256sum -c checksums.txt"
            echo "\`\`\`"
          } > release-notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: autoversion ${{ steps.prepare.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
